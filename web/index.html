<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Граф денег — рабочее место аналитика</title>

<!-- Только CDN, никакой сборки: npm install на машине жюри лотерея, а это 25 баллов.
     Шрифты тоже с CDN, но интерфейс полностью работоспособен на системных. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.2/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.30.2/cytoscape.min.js"></script>

<style>
/* ── Токены ───────────────────────────────────────────────────────────────
   Светлая бумажная поверхность, волосяные линии, почти без теней.
   Плотность дашбордная: базовый кегль 14, шаг сетки 4.                     */
:root{
  --ink:#20332f; --muted:#667671; --faint:#8a9a94;
  --line:#e1e7e3; --line-soft:#eef2ef;
  --surface:#fff; --paper:#f3f6f3; --sunken:#f9fbf8;
  --green:#246953; --dark:#163c3a; --mint:#e7f2eb; --gold:#b87b28;
  --danger:#a8342c;
  --radius:14px; --radius-sm:8px; --radius-xs:6px;
  --shadow:0 5px 24px #20332f0a;
  --rail:236px;

  /* Роли. Семь различимых тонов на бумаге, каждый ≥3:1 к фону. */
  --r-coordinator:#3b6fb6; --r-consolidator:#1f6b4f; --r-distributor:#b87b28;
  --r-transit:#3f9d92;     --r-terminal:#9b6a8f;     --r-peripheral:#aebdb6;
  --r-boundary:#c1d3cd;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font:14px/1.45 'Golos Text','Segoe UI',system-ui,sans-serif;
  font-synthesis:none; -webkit-font-smoothing:antialiased;
}
/* Табличные цифры везде, где есть числа: колонки не пляшут при обновлении */
.num{font-variant-numeric:tabular-nums}
.mono{font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
      font-variant-numeric:tabular-nums}

#root{display:flex;min-height:100vh}

/* ── Левый рельс ─────────────────────────────────────────────────────── */
.rail{width:var(--rail);flex:0 0 var(--rail);background:var(--dark);color:#dce8e2;
      display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:10px;align-items:center;padding:20px 18px 14px}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--mint);
            color:var(--dark);display:grid;place-items:center;flex:0 0 34px}
.brand-name{font-size:19px;font-weight:650;letter-spacing:-.01em;line-height:1.1}
.brand-sub{font-size:11px;color:#8fada2;margin-top:2px}
.ws{margin:4px 14px 18px;padding:11px 12px;border-radius:var(--radius-sm);
    background:#ffffff14;display:flex;gap:10px;align-items:center}
.ws-badge{width:26px;height:26px;border-radius:7px;background:#ffffff1f;
          display:grid;place-items:center;font-size:12px;font-weight:600;flex:0 0 26px}
.ws-title{font-size:13px;font-weight:600}
.ws-sub{font-size:11px;color:#8fada2}
.rail-label{font-size:11px;color:#7f9a90;padding:0 18px 8px;letter-spacing:.02em}
.nav{display:flex;flex-direction:column;gap:2px;padding:0 10px;overflow-y:auto}
.nav button{all:unset;display:flex;align-items:center;gap:11px;padding:9px 12px;
            border-radius:var(--radius-sm);cursor:pointer;font-size:13.5px;
            color:#cfe0d8;transition:background .15s ease,color .15s ease}
.nav button:hover{background:#ffffff12;color:#fff}
.nav button:focus-visible{outline:2px solid var(--mint);outline-offset:1px}
.nav button[aria-current="page"]{background:#ffffff1f;color:#fff;font-weight:600}
.nav .count{margin-left:auto;font-size:11.5px;color:#93b0a6;font-variant-numeric:tabular-nums}
.nav button[aria-current="page"] .count{color:#cfe0d8}
.rail-foot{margin-top:auto;padding:16px 18px;border-top:1px solid #ffffff14;
           font-size:11px;color:#7f9a90}

/* ── Верхняя строка ──────────────────────────────────────────────────── */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:16px;padding:0 28px;height:56px;
        background:var(--surface);border-bottom:1px solid var(--line);
        position:sticky;top:0;z-index:20}
.crumbs{font-size:13px;color:var(--muted)}
.crumbs b{color:var(--ink);font-weight:600}
.search{margin-left:auto;position:relative;width:min(360px,38vw)}
.search input{width:100%;height:34px;padding:0 64px 0 32px;border-radius:var(--radius-sm);
              border:1px solid var(--line);background:var(--sunken);color:var(--ink);
              font:inherit;font-size:13px}
.search input:focus{outline:none;border-color:var(--green);background:var(--surface)}
.search .ico{position:absolute;left:10px;top:9px;color:var(--faint)}
.search .keys{position:absolute;right:8px;top:7px;display:flex;gap:4px}
.kbd{min-width:18px;height:20px;padding:0 5px;border:1px solid var(--line);
     border-radius:5px;background:var(--surface);font-size:11px;color:var(--muted);
     display:grid;place-items:center}
.status{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);
        white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex:0 0 7px}

/* ── Содержимое ──────────────────────────────────────────────────────── */
.wrap{padding:24px 28px 40px;max-width:1560px;width:100%}
.head{display:flex;align-items:flex-start;gap:24px;margin-bottom:20px}
.eyebrow{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);
         margin-bottom:9px}
h1{font-size:28px;font-weight:650;letter-spacing:-.02em;margin:0 0 6px;line-height:1.15}
.lede{font-size:14px;color:var(--muted);max-width:66ch;margin:0}
.actions{margin-left:auto;display:flex;gap:9px;flex:0 0 auto}
.btn{all:unset;display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 15px;
     border-radius:var(--radius-sm);font-size:13.5px;font-weight:500;cursor:pointer;
     transition:background .15s ease,transform .1s ease;white-space:nowrap}
.btn:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--green);color:#fff}
.btn-primary:hover{background:#1d5843}
.btn-ghost{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn-ghost:hover{background:var(--sunken)}
.btn[disabled]{opacity:.45;cursor:default;transform:none}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
      box-shadow:var(--shadow)}
.card-head{padding:16px 18px;border-bottom:1px solid var(--line-soft);
           display:flex;align-items:center;gap:14px}
.card-title{font-size:15px;font-weight:600}
.card-sub{font-size:12.5px;color:var(--muted);margin-top:2px}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);
      border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
      overflow:hidden;margin-bottom:14px}
.kpi{padding:16px 18px;border-right:1px solid var(--line-soft)}
.kpi:last-child{border-right:0}
.kpi-l{font-size:12.5px;color:var(--muted);margin-bottom:6px}
.kpi-v{font-size:26px;font-weight:650;letter-spacing:-.02em;line-height:1.1}
.kpi-v .unit{font-size:15px;font-weight:500;color:var(--muted);margin-left:3px}
.kpi-c{font-size:12px;color:var(--faint);margin-top:5px}

.note{display:flex;gap:12px;align-items:center;padding:11px 16px;margin-bottom:16px;
      background:var(--mint);border-radius:var(--radius-sm);font-size:12.5px;color:#2c5546}
.note a{margin-left:auto;color:var(--green);white-space:nowrap}

/* Раскладка карты */
.split{display:grid;grid-template-columns:minmax(0,1fr) 372px;gap:14px;align-items:start}
@media (max-width:1180px){.split{grid-template-columns:1fr}}

.seg{display:flex;background:var(--sunken);border:1px solid var(--line);
     border-radius:var(--radius-sm);padding:2px;margin-left:auto}
.seg button{all:unset;padding:5px 13px;border-radius:6px;font-size:12.5px;cursor:pointer;
            color:var(--muted);transition:background .15s ease,color .15s ease}
.seg button:hover{color:var(--ink)}
.seg button:focus-visible{outline:2px solid var(--green);outline-offset:1px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;
                                 box-shadow:0 1px 2px #20332f14}

#cy{height:clamp(420px,58vh,640px);background:var(--sunken);
    border-radius:0 0 var(--radius) var(--radius)}
.legend{display:flex;flex-wrap:wrap;gap:6px 4px;padding:12px 18px;
        border-top:1px solid var(--line-soft)}
.legend button{all:unset;display:flex;align-items:center;gap:7px;padding:4px 9px;
               border-radius:999px;cursor:pointer;font-size:12.5px;color:var(--ink);
               transition:background .15s ease,opacity .15s ease}
.legend button:hover{background:var(--sunken)}
.legend button:focus-visible{outline:2px solid var(--green);outline-offset:1px}
.legend button[aria-pressed="false"]{opacity:.38}
.legend .swatch{width:10px;height:10px;border-radius:50%;flex:0 0 10px}
.legend .n{color:var(--faint);font-variant-numeric:tabular-nums;font-size:11.5px}
.hint{padding:0 18px 14px;font-size:12px;color:var(--faint)}

/* Карточка клиента */
.gid{font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;font-size:14px;
     letter-spacing:-.02em;word-break:break-all}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 2px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;
       font-size:12px;background:var(--sunken);border:1px solid var(--line);color:var(--ink)}
.badge .swatch{width:8px;height:8px;border-radius:50%}
.score{display:flex;align-items:baseline;gap:8px;margin:16px 0 4px}
.score-v{font-size:30px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.score-max{font-size:14px;color:var(--muted)}
.score-l{font-size:12.5px;color:var(--muted)}
.meter{height:5px;border-radius:3px;background:var(--line-soft);overflow:hidden;margin:9px 0 2px}
.meter i{display:block;height:100%;background:var(--green);border-radius:3px;
         transition:width .35s cubic-bezier(.2,.8,.2,1)}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;margin:18px 0 4px}
.pair-l{font-size:12px;color:var(--muted);margin-bottom:3px}
.pair-v{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.pair-v small{font-weight:400;color:var(--muted);font-size:12px}
details.why{margin-top:16px;border-top:1px solid var(--line-soft);padding-top:12px}
details.why summary{cursor:pointer;font-size:13px;font-weight:500;color:var(--green);
                    list-style:none;display:flex;align-items:center;gap:7px}
details.why summary::-webkit-details-marker{display:none}
details.why summary:focus-visible{outline:2px solid var(--green);outline-offset:2px;
                                  border-radius:4px}
details.why[open] summary .chev{transform:rotate(90deg)}
.chev{transition:transform .18s ease;display:inline-flex}
.evidence{margin-top:10px;padding:11px 13px;background:var(--sunken);
          border-left:2px solid var(--green);border-radius:0 var(--radius-xs) var(--radius-xs) 0;
          font-size:13px;line-height:1.5}
.cp{display:flex;justify-content:space-between;gap:12px;padding:6px 0;
    border-bottom:1px solid var(--line-soft);font-size:13px}
.cp:last-child{border-bottom:0}
.cp .mono{font-size:12.5px;color:var(--muted);cursor:pointer}
.cp .mono:hover{color:var(--green)}

/* Таблицы */
table{width:100%;border-collapse:collapse;table-layout:fixed}
th{text-align:left;font-size:12px;font-weight:500;color:var(--muted);padding:11px 18px;
   border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 18px;border-bottom:1px solid var(--line-soft);font-size:13.5px;
   vertical-align:top}
tbody tr{cursor:pointer;transition:background .12s ease}
tbody tr:hover{background:var(--sunken)}
tbody tr:focus-visible{outline:2px solid var(--green);outline-offset:-2px}
td.rank{color:var(--faint);font-variant-numeric:tabular-nums;width:44px}
/* Обоснование обрезаем до двух строк: без ограничения строка растёт
   на пол-экрана и таблица перестаёт сканироваться взглядом.
   Полный текст доступен в карточке клиента и в title. */
td.why{color:var(--muted);font-size:12.5px;line-height:1.45;
       display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
       overflow:hidden}

/* Ассистент */
.chat{display:flex;flex-direction:column;gap:12px}
.msg{padding:12px 15px;border-radius:var(--radius-sm);font-size:13.5px;line-height:1.55;
     white-space:pre-wrap;max-width:min(760px,90%)}
.msg.me{background:var(--dark);color:#eaf3ee;align-self:flex-end}
.msg.bot{background:var(--surface);border:1px solid var(--line)}
.msg.err{background:#fdf3f2;border-color:#f0d6d3;color:var(--danger)}
.msg .mode{display:block;margin-top:8px;font-size:11.5px;color:var(--faint)}
.cite{color:var(--green);cursor:pointer;border-bottom:1px dashed #24695366;
      font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12.5px}
.ask{display:flex;gap:9px;margin-top:4px}
.ask input{flex:1;height:38px;padding:0 13px;border-radius:var(--radius-sm);
           border:1px solid var(--line);background:var(--surface);font:inherit;font-size:13.5px}
.ask input:focus{outline:none;border-color:var(--green)}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.chip{all:unset;padding:6px 11px;border-radius:999px;border:1px solid var(--line);
      background:var(--surface);font-size:12.5px;color:var(--muted);cursor:pointer;
      transition:border-color .15s ease,color .15s ease}
.chip:hover{border-color:var(--green);color:var(--green)}
.chip:focus-visible{outline:2px solid var(--green);outline-offset:1px}

/* Служебные состояния */
.empty{padding:40px 18px;text-align:center;color:var(--muted);font-size:13.5px}
.empty b{display:block;color:var(--ink);font-size:15px;font-weight:600;margin-bottom:6px}
.skeleton{background:linear-gradient(90deg,var(--line-soft) 25%,var(--sunken) 37%,var(--line-soft) 63%);
          background-size:400% 100%;border-radius:var(--radius-xs);
          animation:sheen 1.3s ease-in-out infinite}
@keyframes sheen{0%{background-position:100% 0}100%{background-position:0 0}}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:60;
       background:var(--dark);color:#eaf3ee;padding:11px 17px;border-radius:var(--radius-sm);
       font-size:13px;box-shadow:0 10px 34px #20332f2e;max-width:74vw}
.toast.bad{background:var(--danger)}

/* Движение только осмысленное: появление данных и смена состояния. */
.enter{animation:rise .34s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important;animation-iteration-count:1 !important;
    transition-duration:.001ms !important}
}
@media (max-width:920px){
  :root{--rail:0px}
  .rail{display:none}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .wrap{padding:16px}
  .topbar{padding:0 16px}
}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const {useState, useEffect, useRef, useCallback, useMemo} = React;

/* ── Словарь ролей ────────────────────────────────────────────────────────
   Роли названы по-русски и по смыслу. Аналитик читает «Сбор средств»,
   а не consolidator: английский технический ярлык требует перевода в уме,
   а объяснять роль надо за минуту.                                        */
/* Цвета литеральные, а не var(--…): Cytoscape рисует в canvas и CSS-переменные
   там не резолвятся — на схеме получались бледные серые точки. */
const ROLES = {
  coordinator:      {ru:'Связующий узел',        color:'#3b6fb6', hint:'собирает и раздаёт деньги нескольких фигурантов'},
  consolidator:     {ru:'Сбор средств',          color:'#1f6b4f', hint:'принимает от многих, удерживает большую часть'},
  distributor:      {ru:'Распределение',         color:'#b87b28', hint:'рассылает веером на многих получателей'},
  transit:          {ru:'Транзит',               color:'#3f9d92', hint:'пропускает деньги насквозь, не удерживая'},
  terminal:         {ru:'Конечный получатель',   color:'#9b6a8f', hint:'обход развернул узел, исходящих нет'},
  terminal_unknown: {ru:'Граница обхода',        color:'#c1d3cd', hint:'4-е колено, конечность не подтверждена'},
  peripheral:       {ru:'Недостаточно признаков',color:'#aebdb6', hint:'слабые связи и малый оборот'},
};
const ROLE_ORDER = ['coordinator','consolidator','distributor','transit',
                    'terminal','terminal_unknown','peripheral'];
const roleRu = r => (ROLES[r] || {}).ru || r || '—';
const roleColor = r => (ROLES[r] || {}).color || 'var(--r-peripheral)';

/* ── Числа ───────────────────────────────────────────────────────────────
   Русская локаль: разряды пробелом, дробная часть запятой.                */
const nf = new Intl.NumberFormat('ru-RU');
const num = n => (n == null || Number.isNaN(+n)) ? '—' : nf.format(Math.round(+n));
const dec = (n, d = 2) => (n == null || Number.isNaN(+n)) ? '—'
  : (+n).toFixed(d).replace('.', ',');
function kzt(v){
  if (v == null || Number.isNaN(+v)) return '—';
  const a = Math.abs(+v);
  if (a >= 1e6) return dec(+v / 1e6, 2) + ' млн ₸';
  if (a >= 1e3) return num(+v / 1e3) + ' тыс ₸';
  return num(v) + ' ₸';
}
const SHORT = g => '…' + String(g).slice(-7);
const plural = (n, f) => {
  const a = Math.abs(n) % 100, b = a % 10;
  return n + ' ' + (a > 10 && a < 20 ? f[2] : b === 1 ? f[0] : b >= 2 && b <= 4 ? f[1] : f[2]);
};

/* ── Иконки. Один набор, одна толщина штриха 1.6. ────────────────────── */
const Ico = ({d, size = 17}) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
       strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">{d}</svg>
);
const I = {
  map:    <Ico d={<><circle cx="6" cy="7" r="2.4"/><circle cx="18" cy="6" r="2.4"/><circle cx="12" cy="18" r="2.4"/><path d="M7.7 8.6 10.6 16M16.4 8 13.3 16.2M8.4 6.5h7.2"/></>}/>,
  list:   <Ico d={<><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></>}/>,
  layers: <Ico d={<><path d="M12 3 3 8l9 5 9-5-9-5Z"/><path d="m3 14 9 5 9-5"/></>}/>,
  shield: <Ico d={<><path d="M12 3 5 6v5c0 4.2 2.9 8 7 9 4.1-1 7-4.8 7-9V6l-7-3Z"/></>}/>,
  gap:    <Ico d={<><circle cx="12" cy="12" r="8.5"/><path d="M12 8v5M12 16h.01"/></>}/>,
  chat:   <Ico d={<><path d="M20 15a3 3 0 0 1-3 3H8l-4 3V7a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3v8Z"/></>}/>,
  search: <Ico d={<><circle cx="11" cy="11" r="6.5"/><path d="m20 20-3.6-3.6"/></>} size={15}/>,
  down:   <Ico d={<><path d="M12 4v13M6 12l6 6 6-6"/></>} size={15}/>,
  refresh:<Ico d={<><path d="M20 12a8 8 0 1 1-2.5-5.8M20 4v4h-4"/></>} size={15}/>,
  chev:   <Ico d={<><path d="m9 5 7 7-7 7"/></>} size={14}/>,
};

/* ── Клиент API ──────────────────────────────────────────────────────── */
function useApi(setToast){
  return useMemo(() => {
    const get = async (u) => {
      const r = await fetch(u);
      if (!r.ok) {
        let m = `Запрос не прошёл (${r.status})`;
        try { m = (await r.json()).detail || m; } catch (e) {}
        throw new Error(m);
      }
      return r.json();
    };
    return {
      meta:      () => get('/api/meta'),
      graph:     (l) => get(`/api/graph?layout=${l}`),
      node:      (g) => get(`/api/node/${g}`),
      subgraph:  (g) => get(`/api/subgraph/${g}?hops=1`),
      top:       () => get('/api/top'),
      clusters:  () => get('/api/clusters'),
      resilience:() => get('/api/resilience'),
      ask: async (question) => {
        const r = await fetch('/api/ask', {method:'POST',
          headers:{'Content-Type':'application/json'}, body:JSON.stringify({question})});
        if (!r.ok) throw new Error('Ассистент недоступен');
        return r.json();
      },
      fail: (e) => setToast({text: e.message || String(e), bad: true}),
    };
  }, [setToast]);
}

/* ── Схема сети ──────────────────────────────────────────────────────────
   Координаты считает сервер (src/viz.py), браузер только рисует: раскладка
   детерминирована, появляется мгновенно и совпадает с автономным graph.html. */
function Graph({api, layout, hidden, focus, onPick, onToast, onCount}){
  const box = useRef(null), cy = useRef(null), extra = useRef(new Set());

  useEffect(() => {
    let dead = false;
    // «Фокус» берёт те же данные, но раскладывает силовым алгоритмом на подмножестве:
    // 500 узлов в колонках читаются как точечная матрица, связи в ней не видны.
    const src = layout === 'focus' ? 'flow' : layout;
    api.graph(src).then(data => {
      if (dead || !box.current) return;
      if (cy.current) cy.current.destroy();

      let nodes = data.nodes, edges = data.edges;
      if (layout === 'focus') {
        // Ядро плюс соседи с потолком: без потолка добор соседей раздувает
        // выборку до четырёхсот узлов, и читаемость теряется так же, как в «Потоках».
        const CORE = 40, CAP = 130;
        const byPrio = [...data.nodes].sort((a, b) => b.priority - a.priority);
        const rank = new Map(byPrio.map((n, i) => [n.id, i]));
        const keep = new Set(byPrio.slice(0, CORE).map(n => n.id));
        const cand = new Set();
        data.edges.forEach(e => {
          if (keep.has(e.source) && !keep.has(e.target)) cand.add(e.target);
          if (keep.has(e.target) && !keep.has(e.source)) cand.add(e.source);
        });
        [...cand].sort((a, b) => (rank.get(a) ?? 1e9) - (rank.get(b) ?? 1e9))
                 .slice(0, Math.max(0, CAP - keep.size))
                 .forEach(id => keep.add(id));
        nodes = data.nodes.filter(n => keep.has(n.id));
        edges = data.edges.filter(e => keep.has(e.source) && keep.has(e.target));
      }

      cy.current = cytoscape({
        container: box.current,
        elements: [
          ...nodes.map(n => ({data:{...n, short:SHORT(n.id)},
                              position: layout === 'focus' ? undefined : {x:n.x, y:n.y}})),
          ...edges.map(e => ({data:{...e, id:e.source + '>' + e.target}})),
        ],
        style: [
          {selector:'node', style:{
            'background-color': el => roleColor(el.data('role')),
            'width':  el => (layout === 'focus' ? 14 : 10) + el.data('priority') * 24,
            'height': el => (layout === 'focus' ? 14 : 10) + el.data('priority') * 24,
            'border-width': el => el.data('role') === 'terminal_unknown' ? 1.4
                                 : (el.data('is_seed') ? 2 : 0),
            'border-color': el => el.data('role') === 'terminal_unknown' ? '#a8c0b7' : '#163c3a',
            'background-opacity': el => el.data('role') === 'terminal_unknown' ? 0.18 : 1,
            'label':'', 'transition-property':'opacity', 'transition-duration':'160ms',
          }},
          {selector:'edge', style:{
            'width': el => 0.7 + Math.min(2.6, Math.log10(1 + el.data('sum_kzt')) / 2.9),
            'line-color':'#b3c7bf', 'target-arrow-color':'#9fb8ae',
            'target-arrow-shape':'triangle', 'arrow-scale':0.7,
            'curve-style':'bezier', 'control-point-step-size':24, 'opacity':0.75,
          }},
          {selector:'.tagged', style:{
            'label':'data(short)', 'font-family':'JetBrains Mono, monospace',
            'font-size':'9.5px', 'color':'#42544e', 'text-margin-y':-6,
            'text-background-color':'#f9fbf8', 'text-background-opacity':0.9,
            'text-background-padding':'2px',
          }},
          {selector:'.hit', style:{
            'border-width':3, 'border-color':'#246953', 'z-index':99,
            'width':28, 'height':28, 'background-opacity':1,
          }},
          {selector:'.dim',  style:{'opacity':0.1}},
          {selector:'.gone', style:{'display':'none'}},
        ],
        layout: layout === 'focus'
          ? {name:'cose', animate:false, nodeRepulsion:9500, idealEdgeLength:74,
             nodeOverlap:14, gravity:0.32, numIter:900, padding:26}
          : {name:'preset', padding:24},
        wheelSensitivity:0.22, minZoom:0.18, maxZoom:3.4,
      });

      const top = cy.current.nodes().sort((a, b) => b.data('priority') - a.data('priority'));
      top.slice(0, layout === 'focus' ? 8 : 12).addClass('tagged');
      cy.current.on('tap','node', e => onPick(e.target.id()));
      cy.current.on('tap', e => { if (e.target === cy.current) onPick(null); });
      const byRole = {};
      nodes.forEach(n => { byRole[n.role] = (byRole[n.role] || 0) + 1; });
      onCount({nodes: nodes.length, edges: edges.length, roles: byRole});
    }).catch(api.fail);
    return () => { dead = true; if (cy.current) { cy.current.destroy(); cy.current = null; } };
  }, [layout]);

  useEffect(() => {
    const c = cy.current; if (!c) return;
    c.batch(() => c.nodes().forEach(n => n.toggleClass('gone', hidden.has(n.data('role')))));
  }, [hidden]);

  useEffect(() => {
    const c = cy.current; if (!c) return;
    c.elements().removeClass('hit dim');
    if (!focus) return;
    const show = (n) => {
      const keep = n.closedNeighborhood();
      c.elements().difference(keep).addClass('dim');
      n.addClass('hit');
      c.animate({center:{eles:n}, zoom:1.15}, {duration:320, easing:'ease-out'});
    };
    const found = c.getElementById(String(focus));
    if (found && found.length) return show(found);
    if (extra.current.has(String(focus))) return;
    // Узла нет в отрисованной части: подгружаем окружение отдельным запросом,
    // иначе поиск по gid молча ничего не делал бы для большей части выборки.
    api.subgraph(focus).then(sub => {
      const c2 = cy.current; if (!c2) return;
      const have = new Set(c2.nodes().map(n => n.id()));
      c2.add(sub.nodes.filter(n => !have.has(n.id)).map(n => ({
        data:{...n, short:SHORT(n.id)},
        position:{x:(Math.random()-.5)*260, y:(Math.random()-.5)*260},
      })));
      const ids = new Set(c2.nodes().map(n => n.id()));
      c2.add(sub.edges.filter(e => ids.has(e.source) && ids.has(e.target)
                                && !c2.getElementById(e.source + '>' + e.target).length)
        .map(e => ({data:{...e, id:e.source + '>' + e.target}})));
      const added = c2.getElementById(String(focus));
      c2.layout({name:'concentric', roots:added, animate:false, minNodeSpacing:28,
                 concentric:n => n.id() === String(focus) ? 10 : 1,
                 levelWidth:() => 1, fit:false,
                 boundingBox:{x1:-320,y1:-320,w:640,h:640}}).run();
      extra.current.add(String(focus));
      onToast('Клиента не было на схеме. Подгрузили ' +
              plural(sub.nodes.length,['связанный узел','связанных узла','связанных узлов']) + '.');
      show(added);
    }).catch(api.fail);
  }, [focus]);

  return <div id="cy" ref={box} role="img"
              aria-label="Схема денежных потоков. Цвет обозначает роль, размер — приоритет проверки."/>;
}

/* ── Карточка клиента ────────────────────────────────────────────────── */
function NodeCard({gid, api, onPick, onAsk}){
  const [d, setD] = useState(null), [busy, setBusy] = useState(false);
  useEffect(() => {
    if (!gid) { setD(null); return; }
    setBusy(true);
    api.node(gid).then(setD).catch(e => { api.fail(e); setD(null); })
       .finally(() => setBusy(false));
  }, [gid]);

  if (!gid) return (
    <div className="card">
      <div className="card-head"><div className="card-title">Карточка клиента</div></div>
      <div className="empty">
        <b>Клиент не выбран</b>
        Кликните узел на схеме, найдите по gid или откройте строку из списка приоритетов.
      </div>
    </div>
  );
  if (busy || !d) return (
    <div className="card">
      <div className="card-head"><div className="card-title">Карточка клиента</div></div>
      <div style={{padding:'18px'}}>
        <div className="skeleton" style={{height:16,width:'72%',marginBottom:12}}/>
        <div className="skeleton" style={{height:34,width:'46%',marginBottom:18}}/>
        <div className="skeleton" style={{height:64,width:'100%'}}/>
      </div>
    </div>
  );

  const pct = Math.round((d.priority_score || 0) * 1000) / 10;
  return (
    <div className="card enter" key={gid}>
      <div className="card-head">
        <div style={{minWidth:0}}>
          <div className="card-title">Карточка клиента</div>
          <div className="card-sub">колено обхода {d.depth}{d.is_seed ? ' · исходный фигурант' : ''}</div>
        </div>
      </div>
      <div style={{padding:'16px 18px 18px'}}>
        <div className="gid">{d.gid}</div>
        <div className="badges">
          <span className="badge">
            <i className="swatch" style={{background:roleColor(d.role)}}/>{roleRu(d.role)}
          </span>
          <span className="badge">Кластер {d.cluster_id}</span>
          {d.on_screen === false && <span className="badge">Вне схемы</span>}
        </div>

        <div className="score">
          <span className="score-v">{dec(pct, 1)}</span>
          <span className="score-max">/ 100</span>
        </div>
        <div className="score-l">Приоритет проверки</div>
        <div className="meter"><i style={{width:`${pct}%`}}/></div>
        <div className="score-l">
          Уверенность в роли {dec((d.role_score || 0) * 100, 0)} из 100
        </div>

        <div className="pairs">
          <div>
            <div className="pair-l">Получено в выборке</div>
            <div className="pair-v">{kzt(d.in_kzt)}</div>
          </div>
          <div>
            <div className="pair-l">Отправлено</div>
            <div className="pair-v">{kzt(d.out_kzt)}</div>
          </div>
          <div>
            <div className="pair-l">Плательщиков</div>
            <div className="pair-v">{num(d.in_deg)}</div>
          </div>
          <div>
            <div className="pair-l">Получателей</div>
            <div className="pair-v">{num(d.out_deg)}</div>
          </div>
          {d.external_funding_gap > 0 && (
            <div style={{gridColumn:'1 / -1'}}>
              <div className="pair-l">Пришло из-за пределов выборки</div>
              <div className="pair-v" style={{color:'var(--gold)'}}>{kzt(d.external_funding_gap)}</div>
            </div>
          )}
        </div>

        <details className="why" open>
          <summary><span className="chev">{I.chev}</span>Почему эта роль</summary>
          <div className="evidence">{d.evidence}</div>
          {d.next_request && (
            <div className="evidence" style={{borderLeftColor:'var(--gold)',marginTop:8}}>
              <b>Следующий запрос.</b> {d.next_request}
            </div>
          )}
        </details>

        {!!(d.top_senders || []).length && (
          <details className="why">
            <summary><span className="chev">{I.chev}</span>Крупнейшие плательщики</summary>
            <div style={{marginTop:8}}>
              {d.top_senders.map(s => (
                <div className="cp" key={s.gid}>
                  <span className="mono" onClick={() => onPick(s.gid)}>{SHORT(s.gid)}</span>
                  <span className="num">{kzt(s.sum_kzt)}</span>
                </div>
              ))}
            </div>
          </details>
        )}
        {!!(d.top_receivers || []).length && (
          <details className="why">
            <summary><span className="chev">{I.chev}</span>Крупнейшие получатели</summary>
            <div style={{marginTop:8}}>
              {d.top_receivers.map(s => (
                <div className="cp" key={s.gid}>
                  <span className="mono" onClick={() => onPick(s.gid)}>{SHORT(s.gid)}</span>
                  <span className="num">{kzt(s.sum_kzt)}</span>
                </div>
              ))}
            </div>
          </details>
        )}

        <div style={{marginTop:16}}>
          <button className="btn btn-ghost" style={{width:'100%',justifyContent:'center'}}
                  onClick={() => onAsk(`Расскажи про узел ${d.gid}: роль, потоки и на что обратить внимание`)}>
            {I.chat} Спросить ассистента
          </button>
        </div>
      </div>
    </div>
  );
}

                  <td style={{fontWeight:600}}>{r.removed}</td>
                  <td className="num" style={{textAlign:'right'}}>{num(r.components_targeted)}</td>
                  <td className="num" style={{textAlign:'right',color:'var(--faint)'}}>{dec(r.components_random,1)}</td>
                  <td className="num" style={{textAlign:'right',fontWeight:600}}>{dec(r.components_same_degree,1)}</td>
                  <td className="num" style={{textAlign:'right'}}>{num(r.largest_targeted)}</td>
                </tr>
              ))}
            </tbody>
          </table>
        )}
      </div>
      <div className="note" style={{marginTop:14,alignItems:'flex-start'}}>
        <div>
          <b>Честный отрицательный результат.</b> Случайные узлы той же степени рвут сеть
          не хуже нашего топа{ratio ? ` (в среднем ${dec(ratio,2)} от их результата)` : ''}.
          Разрушительность объясняется степенью узла, отдельного эффекта приоритизации мы
          не обнаружили и не заявляем. Сравнение со случайными узлами без учёта степени
          даёт эффектную цифру, но отвечает на другой вопрос.
        </div>
      </div>
    </>
  );
}

     'Граф собран обходом от 81 фигуранта по исходящим. Входящие из-за пределов выборки не видны, поэтому полный баланс клиента посчитать нельзя.'],
    ['Порог 5 000 ₸',
     'Переводы меньше порога в выгрузку не попали. Дробление сумм ниже него невидимо в принципе, и гипотезы о нём мы помечаем как спекулятивные.'],
    ['Граница обхода на 4-м колене',
     '444 клиента не имеют исходящих только потому, что обход на них закончился. Они выделены отдельной ролью, их конечность не подтверждена.'],
    ['У исходных фигурантов занижен вход',
     'Граф собран от них, поэтому отношение «отдал к получил» у этих 81 клиента некорректно и в правила ролей не идёт.'],
    ['63% оборота приходит извне выборки',
     '335 клиентов отдали больше, чем получили внутри графа, суммарно на 229,9 млн ₸. Это главный пробел, и по каждому такому узлу карточка предлагает запросить входящие.'],
    ['Нет размеченных ролей',
     'Эталона не существует, поэтому качество проверяется внедрением синтетических структур с заведомо известной ролью, а не долей верных ответов.'],

  return (
    <div className="card">

/* Подсказки сформулированы по-русски и так, чтобы каждая однозначно ложилась
   на инструмент ассистента: who_collects_from, top_nodes, list_clusters,
   cluster_summary. Английские ярлыки ролей в интерфейс не выносим. */
const SUGGESTIONS = [
  'Кто собирает деньги с узлов 100000003684369100 и 100000000343175100?',
  'Покажи топ-10 клиентов по приоритету проверки',
  'Какие кластеры самые значимые и что в них?',
  'Что известно про кластер 14?',
];

function AssistantView({api, seed, onSeedUsed, onPick}){
  const [q, setQ] = useState(''), [log, setLog] = useState([]), [busy, setBusy] = useState(false);
  const tail = useRef(null);

  const send = useCallback((text) => {
    const question = (text ?? q).trim();
    if (!question || busy) return;
    setLog(l => [...l, {me:true, text:question}]); setQ(''); setBusy(true);
    api.ask(question)
      .then(r => setLog(l => [...l, {text:r.answer, mode:r.mode, gids:r.cited_gids || []}]))
      .catch(e => setLog(l => [...l, {text:e.message, err:true}]))
      .finally(() => setBusy(false));
  }, [q, busy, api]);

  useEffect(() => { if (seed) { send(seed); onSeedUsed(); } }, [seed]);
  useEffect(() => { if (tail.current) tail.current.scrollIntoView({behavior:'smooth', block:'end'}); }, [log, busy]);

  return (
    <div className="card">
      <div className="card-head">
        <div>
          <div className="card-title">Ассистент аналитика</div>
          <div className="card-sub">
            Отвечает только числами из выгрузок и называет gid, на которые опирается.
          </div>
        </div>
      </div>
      <div style={{padding:'16px 18px 18px'}}>
        <div className="chat">
          {!log.length && (
            <div className="empty" style={{padding:'26px 0 18px'}}>
              <b>Спросите словами</b>
              Ассистент ходит по тем же выгрузкам, что и схема, и ничего не придумывает.
            </div>
          )}
          {log.map((m, i) => (
            <div key={i} className={'msg enter ' + (m.me ? 'me' : m.err ? 'bot err' : 'bot')}>
              {m.text}
              {!!(m.gids || []).length && (
                <span className="mode">
                  Упомянуты:{' '}
                  {m.gids.slice(0, 6).map((g, k) => (
                    <React.Fragment key={g}>
                      {k > 0 && ', '}
                      <span className="cite" onClick={() => onPick(String(g))}>{SHORT(g)}</span>
                    </React.Fragment>
                  ))}
                </span>
              )}
              {m.mode === 'fallback' &&
                <span className="mode">Шаблонный режим: ключ LLM не задан, ответ собран по тем же данным.</span>}
            </div>
          ))}
          {busy && <div className="msg bot"><span className="skeleton"
                        style={{display:'block',height:14,width:180}}/></div>}
          <div ref={tail}/>
        </div>
        <div className="ask">
          <input value={q} onChange={e => setQ(e.target.value)}
                 onKeyDown={e => e.key === 'Enter' && send()}
                 aria-label="Вопрос ассистенту"
                 placeholder="Например: кто собирает деньги с этих пятерых?"/>
          <button className="btn btn-primary" onClick={() => send()} disabled={busy}>
            {busy ? 'Думает…' : 'Спросить'}
          </button>
        </div>
        <div className="chips">
          {SUGGESTIONS.map(s => (
            <button className="chip" key={s} onClick={() => send(s)}>{s}</button>
          ))}
        </div>
      </div>
    </div>
  );
}

/* ── Приложение ──────────────────────────────────────────────────────── */
const VIEWS = {
  map:        {t:'Карта потоков', icon:I.map,    h1:'Карта денежных потоков',
               lede:'От отдельных переводов — к объяснимой структуре сети.'},
  priorities: {t:'Приоритеты',    icon:I.list,   h1:'С чего начать проверку',
               lede:'Ранжированный список клиентов с обоснованием по каждому.'},
  clusters:   {t:'Кластеры',      icon:I.layers, h1:'Кластеры сети',
               lede:'Связанные фрагменты и гипотеза о назначении каждого.'},
  resilience: {t:'Устойчивость',  icon:I.shield, h1:'Устойчивость сети',
               lede:'Что произойдёт с сетью, если изъять узлы из верха списка.'},
  quality:    {t:'Полнота данных',icon:I.gap,    h1:'Полнота данных',
               lede:'Чего эти данные не позволяют утверждать и какой запрос сделать следующим.'},
  assistant:  {t:'Ассистент',     icon:I.chat,   h1:'Ассистент аналитика',
               lede:'Вопрос словами — ответ по графу со ссылками на клиентов.'},
};

function App(){
  const [view, setView] = useState('map');
  const [meta, setMeta] = useState(null);
  const [layout, setLayout] = useState('focus');
  const [hidden, setHidden] = useState(new Set());
  const [focus, setFocus] = useState(null);
  const [query, setQuery] = useState('');
  const [toast, setToast] = useState(null);
  const [seed, setSeed] = useState(null);
  const api = useApi(setToast);
  const searchRef = useRef(null);

  useEffect(() => { api.meta().then(setMeta).catch(api.fail); }, []);
  useEffect(() => {
    if (!toast) return;
    const t = setTimeout(() => setToast(null), 4200);
    return () => clearTimeout(t);
  }, [toast]);

  // «/» ставит курсор в поиск, Esc снимает фокус с узла
  useEffect(() => {
    const onKey = (e) => {
      const typing = /^(INPUT|TEXTAREA)$/.test((e.target || {}).tagName || '');
      if (e.key === '/' && !typing) { e.preventDefault(); searchRef.current && searchRef.current.focus(); }
      if (e.key === 'Escape') { setFocus(null); if (searchRef.current) searchRef.current.blur(); }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  const pick = useCallback((gid) => {
    setFocus(gid ? String(gid) : null);
    if (gid && view !== 'map') setView('map');
  }, [view]);

  const toggleRole = (r) => setHidden(h => {
    const n = new Set(h); n.has(r) ? n.delete(r) : n.add(r); return n;
  });

  const submitSearch = (e) => {
    e.preventDefault();
    const g = query.trim();
    if (!g) return;
    if (!/^\d{6,20}$/.test(g)) { setToast({text:'gid — это число из 18 цифр', bad:true}); return; }
    pick(g);
  };

  const ask = (text) => { setSeed(text); setView('assistant'); };
  const v = VIEWS[view];

  return (
    <>
      <nav className="rail" aria-label="Разделы">
        <div className="brand">
          <div className="brand-mark">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 strokeWidth="1.8" strokeLinecap="round" aria-hidden="true">
              <circle cx="6" cy="7" r="2.2"/><circle cx="18" cy="6" r="2.2"/>
              <circle cx="12" cy="18" r="2.2"/>
              <path d="M7.8 8.5 10.7 15.8M16.3 7.9 13.2 16"/>
            </svg>
          </div>
          <div>
            <div className="brand-name">граф денег</div>
            <div className="brand-sub">Финансовая аналитика</div>
          </div>
        </div>

        <div className="ws">
          <div className="ws-badge">NI</div>
          <div style={{minWidth:0}}>
            <div className="ws-title">Natural Intelligence</div>
            <div className="ws-sub">Исследование сети</div>
          </div>
        </div>

        <div className="rail-label">Рабочее место</div>
        <div className="nav">
          {Object.entries(VIEWS).map(([k, cfg]) => (
            <button key={k} id={`nav-${k}`} onClick={() => setView(k)}
                    aria-current={view === k ? 'page' : undefined}>
              {cfg.icon}{cfg.t}
              {k === 'priorities' && meta && <span className="count">25</span>}
              {k === 'clusters' && meta && <span className="count">89</span>}
            </button>
          ))}
        </div>

        <div className="rail-foot">
          Данные обезличены и обрабатываются локально.<br/>
          Выводы — гипотезы для проверки.
        </div>
      </nav>

      <div className="main">
        <header className="topbar">
          <div className="crumbs">Исследования <span style={{opacity:.4}}>/</span> <b>Граф денег</b></div>
          <form className="search" onSubmit={submitSearch} role="search">
            <span className="ico">{I.search}</span>
            <input ref={searchRef} value={query} onChange={e => setQuery(e.target.value)}
                   placeholder="Найти клиента по gid" aria-label="Поиск клиента по gid"/>
            <span className="keys"><span className="kbd">/</span><span className="kbd">↵</span></span>
          </form>
          <div className="status"><i className="dot"/>Локально</div>
        </header>

        <div className="wrap">
          <div className="head">
            <div style={{minWidth:0}}>
              <div className="eyebrow">
                <i className="dot" style={{background:'var(--gold)'}}/>
                Транзакционная сеть · 1 июл — 31 июл 2026
              </div>
              <h1>{v.h1}</h1>
              <p className="lede">{v.lede}</p>
            </div>
            <div className="actions">
              <a className="btn btn-ghost" href="/api/top" download="top_nodes.json">
                {I.down} Выгрузка
              </a>
              <button className="btn btn-primary" onClick={() => location.reload()}>
                {I.refresh} Обновить
              </button>
            </div>
          </div>

          {view === 'map' && (
            <MapView api={api} meta={meta} layout={layout} setLayout={setLayout}
                     hidden={hidden} toggleRole={toggleRole} focus={focus}
                     onPick={pick} onToast={t => setToast({text:t})} onAsk={ask}/>
          )}
          {view === 'priorities' && <TopView api={api} onPick={pick}/>}
          {view === 'clusters'   && <ClusterView api={api} onPick={pick}/>}
          {view === 'resilience' && <ResilienceView api={api}/>}
          {view === 'quality'    && <QualityView/>}
          {view === 'assistant'  && (
            <AssistantView api={api} seed={seed} onSeedUsed={() => setSeed(null)} onPick={pick}/>
          )}
        </div>
      </div>

      {toast && (
        <div className={'toast enter' + (toast.bad ? ' bad' : '')} role="status" aria-live="polite">
          {toast.text}
        </div>
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
